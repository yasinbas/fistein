spring:
  application:
    name: fistein-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-this-in-env}
  expiration: ${JWT_EXPIRATION:86400}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
